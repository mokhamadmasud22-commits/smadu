      function esc(val) {
        if (val === null || val === undefined) return '';
        return String(val)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function uuid() {
        if (window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID();
        return 'id-' + Math.random().toString(36).slice(2, 10) + '-' + Date.now().toString(36);
      }

      function computeScoreStats(obsScores) {
        var dist = { 1: 0, 2: 0, 3: 0, 4: 0 };
        var values = [];
        if (obsScores && typeof obsScores === 'object') {
          Object.keys(obsScores).forEach(function (k) {
            var v = Number(obsScores[k]);
            if (v >= 1 && v <= 4) {
              values.push(v);
              dist[v] = (dist[v] || 0) + 1;
            }
          });
        }
        var sum = values.reduce(function (a, b) { return a + b; }, 0);
        var avg = values.length > 0 ? sum / values.length : 0;
        var category = 'Belum Dinilai';
        if (avg >= 3.5) category = 'Sangat Baik';
        else if (avg >= 2.75) category = 'Baik';
        else if (avg >= 2.0) category = 'Cukup';
        else if (avg > 0) category = 'Perlu Pembinaan';
        return { avg: avg, category: category, dist: dist, count: values.length };
      }

        return (sections || []).reduce(function (acc, s) {

      function pushToServer(methodName, arg1, arg2, onDone) {
        saveLocalBackup();
        if (!isAppsScriptEnv()) {

        state.syncing = true;

          .withSuccessHandler(function (res) {

          .withFailureHandler(function (err) {

            showToast('Gagal sinkronisasi ke Spreadsheet: ' + (err.message || err), 'error');

        if (arg2 !== undefined) runner[methodName](arg1, arg2);

      }

      function getSmartRecommendation(finding) {
        var lower = String(finding || '').toLowerCase();
        for (var i = 0; i < PROBLEM_CATEGORIES.length; i++) {
          var cat = PROBLEM_CATEGORIES[i];
          if (cat.keywords.some(function (kw) { return lower.indexOf(kw) >= 0; })) {
            return 'Rekomendasi (' + cat.name + '): ' + cat.solusiIHT;
          }
        }
        return 'Berdasarkan temuan "' + finding + '": Rekomendasikan pendampingan klinis terjadwal bersama supervisor atau rekan sejawat serta refleksi siklus mingguan.';
      }

      function syncCompletedSupervisionsToFollowUps() {
        var added = [];
        state.supervisions.forEach(function (sv) {
          if (sv.status !== 'Selesai' && sv.status !== 'Tindak Lanjut' && !sv.instrument.perbaikan) return;
          var guru = state.gurus.find(function (g) { return g.id === sv.instrument.guruId; });
          var guruNama = (guru && guru.nama) || sv.instrument.namaGuru || 'Guru Terdaftar';
          var exists = state.followUps.some(function (f) {
            return f.guruNama.toLowerCase() === guruNama.toLowerCase() || f.id === 'tl-sv-' + sv.id;
          });
          if (!exists && sv.instrument.perbaikan) {
            var finding = sv.instrument.perbaikan.slice(0, 50);
            added.push({
              id: 'tl-sv-' + sv.id,
              guruNama: guruNama,
              guruNip: sv.instrument.nipGuru || (guru && guru.nip) || '',
              mapel: sv.instrument.mapel || (guru && guru.mapel) || '',
              kelas: sv.instrument.kelas || '',
              temuan: finding,
              intervensi: sv.instrument.rekomendasi ? sv.instrument.rekomendasi.slice(0, 45) : 'Pendampingan Klinis',
              status: sv.status === 'Selesai' ? 'Terealisasi' : 'Dipantau',
              dampak: sv.status === 'Selesai' ? 'Meningkat' : 'Dipantau',
              smartRekomendasi: getSmartRecommendation(finding),
              sudahRefleksi: Boolean(sv.instrument.pascaRefleksi),
              sudahTindakLanjut: sv.status === 'Selesai' || sv.status === 'Tindak Lanjut',
              perubahanPraktik: sv.status === 'Selesai',

        }
      }

      function getAffectedTeachersByCategory(categoryName) {
        var cat = PROBLEM_CATEGORIES.find(function (c) { return c.name === categoryName; });
        if (!cat) return [];
        var list = [];
        var seen = {};
        state.followUps.forEach(function (f) {
          var txt = ((f.temuan || '') + ' ' + (f.intervensi || '')).toLowerCase();
          if (cat.keywords.some(function (kw) { return txt.indexOf(kw) >= 0; })) {
            var key = f.guruNama.toLowerCase();
            seen[key] = true;
            list.push({
              guruNama: f.guruNama,
              mapel: f.mapel || '-',
              kelas: f.kelas || '-',
              detail: f.temuan,
              intervensi: f.intervensi,
              dampak: f.dampak,
              source: 'Tindak Lanjut',
            });
          }
        });
        state.supervisions.forEach(function (sv) {
          var g = state.gurus.find(function (x) { return x.id === sv.instrument.guruId; });
          var nama = (g && g.nama) || sv.instrument.namaGuru || '';
          if (!nama) return;
          var lowScore = cat.rubricIds.some(function (rid) {
            var sc = Number((sv.instrument.obsScores || {})[rid] || 0);
            return sc > 0 && sc <= 2;
          });
          var txt = ((sv.instrument.perbaikan || '') + ' ' + (sv.instrument.rekomendasi || '')).toLowerCase();
          var kwMatch = cat.keywords.some(function (kw) { return txt.indexOf(kw) >= 0; });
          if ((lowScore || kwMatch) && !seen[nama.toLowerCase()]) {
            list.push({
              guruNama: nama,
              mapel: sv.instrument.mapel || '-',
              kelas: sv.instrument.kelas || '-',
              detail: sv.instrument.perbaikan || 'Skor rubrik di bawah target pada aspek ' + cat.shortName,
              intervensi: sv.instrument.rekomendasi || cat.defaultIntervensi,
              dampak: sv.status,
              source: 'Supervisi',
            });
          }
        });
        return list;
      }

      function compressImageFile(file, callback) {
        var reader = new FileReader();
        reader.onload = function (ev) {
          var img = new Image();
          img.onload = function () {
            var maxW = 640;
            var scale = img.width > maxW ? maxW / img.width : 1;
            var canvas = document.createElement('canvas');
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            var ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            callback(canvas.toDataURL('image/jpeg', 0.65));
          };
          img.onerror = function () {
            callback(ev.target.result);
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      }

      }

      function exportCategoryTeachersPdf(catName, teachers, solusiIHT) {
        if (!window.jspdf || !window.jspdf.jsPDF) return showToast('Library PDF belum tersedia.', 'error');
        var jsPDF = window.jspdf.jsPDF;
        var doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

        var pageW = doc.internal.pageSize.getWidth();
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(11);
        doc.text('PETA MASALAH & DAFTAR GURU TERDAMPAK', pageW / 2, 16, { align: 'center' });
        doc.setFontSize(9.5);
        doc.text('Kategori: ' + catName + ' | ' + cfg.schoolName, pageW / 2, 22, { align: 'center' });
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(8.5);
        doc.text('Rekomendasi IHT/Program: ' + solusiIHT, 14, 30, { maxWidth: pageW - 28 });

        var rows = teachers.map(function (t, i) {
          return [i + 1, t.guruNama, t.mapel, t.detail, t.intervensi, t.dampak];
        });
        doc.autoTable({
          startY: 40,
          theme: 'grid',
          styles: { fontSize: 8, cellPadding: 2.5 },
          headStyles: { fillColor: [30, 58, 138], textColor: 255 },
          head: [['No', 'Nama Guru', 'Mapel', 'Temuan / Kendala', 'Intervensi', 'Status']],
          body: rows.length ? rows : [['-', 'Tidak ada guru terdampak', '-', '-', '-', '-']],
        });
        doc.save('Peta_Masalah_' + catName.replace(/[^a-zA-Z0-9]/g, '_') + '.pdf');
        showToast('PDF Peta Masalah kategori berhasil diunduh.', 'success');
      }

      function computeImpactStats() {
        var disupervisi = new Set(), refleksi = new Set(), tindakLanjut = new Set(), praktik = new Set(), pendampingan = new Set();
        state.supervisions.forEach(function (sv) {
          var g = state.gurus.find(function (x) { return x.id === sv.instrument.guruId; });
          var key = ((g && g.nama) || sv.instrument.namaGuru || sv.instrument.guruId || '').trim().toLowerCase();
          if (!key) return;
          var hasScores = Object.keys(sv.instrument.obsScores || {}).length > 0;
          var hasRef = Boolean((sv.instrument.pascaRefleksi || '').trim());
          if (sv.status !== 'Direncakan' || hasScores || hasRef) disupervisi.add(key);
          if (hasRef || ['Pasca-Observasi', 'Tindak Lanjut', 'Selesai'].indexOf(sv.status) >= 0) refleksi.add(key);
          var hasRtl = sv.instrument.rtl && Object.values(sv.instrument.rtl).some(Boolean);
          if (sv.status === 'Tindak Lanjut' || sv.status === 'Selesai' || hasRtl) tindakLanjut.add(key);
          var avg = computeScoreStats(sv.instrument.obsScores).avg;
          if (sv.status === 'Selesai' && avg >= 3) praktik.add(key);
          else if (sv.status === 'Tindak Lanjut' || (sv.status === 'Pasca-Observasi' && avg > 0 && avg < 3)) pendampingan.add(key);
        });
        state.followUps.forEach(function (f) {
          var key = (f.guruNama || '').trim().toLowerCase();
          if (!key) return;
          disupervisi.add(key);
          if (f.sudahRefleksi) refleksi.add(key);
          if (f.sudahTindakLanjut) tindakLanjut.add(key);
          if (f.perubahanPraktik || f.dampak === 'Meningkat') praktik.add(key);
          if (f.perluPendampingan || f.dampak === 'Dipantau' || f.dampak === 'Perlu Pendampingan') pendampingan.add(key);
        });
        return {
          totalDisupervisi: disupervisi.size,
          sudahRefleksi: refleksi.size,
          sudahTindakLanjut: tindakLanjut.size,
          perubahanPraktik: praktik.size,
          perluPendampingan: pendampingan.size,
        };
      }

      function renderTindakLanjut() {
        var impact = computeImpactStats();
        var q = state.tlSearch.toLowerCase();
        var filtered = state.followUps.filter(function (f) {
          var mq = !q || f.guruNama.toLowerCase().indexOf(q) >= 0 || f.temuan.toLowerCase().indexOf(q) >= 0 || f.intervensi.toLowerCase().indexOf(q) >= 0;
          var mi = state.tlImpactFilter === 'all' || f.dampak === state.tlImpactFilter;
          var mp = true;
          if (state.tlProblemFilter !== 'all') {
            var cat = PROBLEM_CATEGORIES.find(function (c) { return c.name === state.tlProblemFilter; });
            if (cat) {
              var txt = ((f.temuan || '') + ' ' + (f.intervensi || '')).toLowerCase();
              mp = cat.keywords.some(function (kw) { return txt.indexOf(kw) >= 0; });
            }
          }
          return mq && mi && mp;
        });

        var catCounts = PROBLEM_CATEGORIES.map(function (cat) {
          var teachers = getAffectedTeachersByCategory(cat.name);
          return { name: cat.name, count: teachers.length, solusi: cat.solusiIHT };
        });
        var maxCat = Math.max(1, Math.max.apply(null, catCounts.map(function (c) { return c.count; })));

        return (
          '<div class="space-y-6">' +
          '  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">' +
          '    <div><h2 class="text-2xl font-display font-bold text-gray-900">Tindak Lanjut &amp; Peta Masalah</h2><p class="text-sm text-gray-500">Pemetaan kendala pembelajaran dan efektivitas intervensi supervisi.</p></div>' +
          '    <button type="button" id="btn-add-tl" class="px-4 py-2 bg-brand-600 text-white rounded-xl text-xs font-bold cursor-pointer">+ Tambah Tindak Lanjut</button>' +
          '  </div>' +
          '  <div class="grid grid-cols-2 sm:grid-cols-5 gap-3 bg-slate-900 text-white p-5 rounded-2xl">' +
          impactTile('Disupervisi', impact.totalDisupervisi, 'Total guru', 'text-white') +
          impactTile('Refleksi', impact.sudahRefleksi, 'Pasca-Obs', 'text-emerald-400') +
          impactTile('Tindak Lanjut', impact.sudahTindakLanjut, 'Intervensi', 'text-indigo-400') +
          impactTile('Meningkat', impact.perubahanPraktik, 'Praktik baik', 'text-emerald-300') +
          impactTile('Coaching', impact.perluPendampingan, 'Perlu pendampingan', 'text-amber-300') +
          '  </div>' +
          '  <div class="bg-white p-6 rounded-2xl border border-gray-200 space-y-3">' +
          '    <div class="flex justify-between items-center"><h3 class="font-display font-bold text-base">Peta Masalah Pembelajaran</h3><span class="text-[11px] text-gray-400">Klik kategori untuk melihat daftar guru &amp; solusi IHT</span></div>' +
          catCounts.map(function (c) {
            var pct = Math.round((c.count / maxCat) * 100);
            return (
              '<button type="button" data-open-cat="' + esc(c.name) + '" class="w-full text-left p-2.5 rounded-xl hover:bg-gray-50 border border-transparent hover:border-gray-200 space-y-1.5 cursor-pointer transition-all">' +
              '  <div class="flex justify-between text-xs font-bold"><span class="text-gray-800">' + esc(c.name) + '</span><span class="text-brand-700">' + c.count + ' Guru Terdampak →</span></div>' +
              '  <svg class="w-full h-3 rounded-full bg-gray-100"><rect x="0" y="0" width="' + pct + '%" height="12" rx="6" fill="#2563eb"></rect></svg>' +
              '</button>'
            );
          }).join('') +
          '  </div>' +
          '  <div class="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden">' +
          '    <div class="p-4 border-b border-gray-100 flex flex-wrap gap-3 justify-between">' +
          '      <input type="text" id="tl-search" value="' + esc(state.tlSearch) + '" placeholder="Cari guru atau temuan..." class="px-3.5 py-2 bg-gray-50 border border-gray-200 rounded-xl text-sm w-full sm:w-64" />' +
          '      <div class="flex flex-wrap gap-2">' +
          '        <select id="tl-problem-filter" class="px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl text-xs font-bold">' +
          '          <option value="all">Semua Kategori</option>' +
          PROBLEM_CATEGORIES.map(function (c) { return '<option value="' + esc(c.name) + '" ' + (state.tlProblemFilter === c.name ? 'selected' : '') + '>' + esc(c.shortName) + '</option>'; }).join('') +
          '        </select>' +
          '        <select id="tl-impact-filter" class="px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl text-xs font-bold">' +
          '          <option value="all">Semua Dampak</option>' +
          '          <option value="Meningkat" ' + (state.tlImpactFilter === 'Meningkat' ? 'selected' : '') + '>Meningkat</option>' +
          '          <option value="Dipantau" ' + (state.tlImpactFilter === 'Dipantau' ? 'selected' : '') + '>Dipantau</option>' +
          '          <option value="Perlu Pendampingan" ' + (state.tlImpactFilter === 'Perlu Pendampingan' ? 'selected' : '') + '>Perlu Pendampingan</option>' +
          '        </select>' +
          '      </div>' +
          '    </div>' +
          '    <div class="overflow-x-auto"><table class="w-full text-left text-sm"><thead class="bg-gray-50 border-b border-gray-200 text-xs uppercase text-gray-500"><tr><th class="px-5 py-3">Guru</th><th class="px-4 py-3">Temuan &amp; Smart Rekomendasi</th><th class="px-4 py-3">Intervensi</th><th class="px-4 py-3">Dampak</th><th class="px-5 py-3 text-right">Aksi</th></tr></thead><tbody>' +
          (filtered.length === 0
            ? '<tr><td colspan="5" class="py-12 text-center text-gray-400 italic">Belum ada data tindak lanjut.</td></tr>'
            : filtered.map(function (f) {
                return (
                  '<tr class="border-b border-gray-100 hover:bg-gray-50">' +
                  '  <td class="px-5 py-3 font-bold">' + esc(f.guruNama) + '<div class="text-xs font-normal text-gray-500">' + esc(f.mapel || '-') + '</div></td>' +
                  '  <td class="px-4 py-3"><p class="font-semibold text-gray-800">' + esc(f.temuan) + '</p>' + (f.smartRekomendasi ? '<p class="text-[11px] text-indigo-700 mt-0.5">' + esc(f.smartRekomendasi) + '</p>' : '') + '</td>' +
                  '  <td class="px-4 py-3 text-xs">' + esc(f.intervensi) + '</td>' +
                  '  <td class="px-4 py-3"><span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-emerald-50 text-emerald-700">' + esc(f.dampak) + '</span></td>' +
                  '  <td class="px-5 py-3 text-right space-x-1.5 whitespace-nowrap">' +
                  '    <button type="button" data-edit-tl="' + esc(f.id) + '" class="px-2.5 py-1 bg-gray-100 text-gray-700 rounded-lg text-xs font-bold cursor-pointer">Edit</button>' +
                  '    <button type="button" data-del-tl="' + esc(f.id) + '" class="px-2.5 py-1 bg-rose-50 text-rose-600 rounded-lg text-xs font-bold cursor-pointer">Hapus</button>' +
                  '  </td>' +
                  '</tr>'
                );
              }).join('')) +
          '    </tbody></table></div>' +
          '  </div>' +
          '</div>'
        );
      }

              '<div class="space-y-3 text-xs">' +
              '  <p class="text-gray-600">Tempel format CSV (<code>Kategori,Indikator,Deskripsi</code>) atau JSON rubrik sekolah:</p>' +
              '  <textarea id="rm-import-text" rows="8" placeholder="Kategori,Indikator,Deskripsi&#10;A. PENDAHULUAN,Apersepsi,Mengaitkan materi dengan konteks nyata" class="w-full p-3 border border-gray-200 rounded-xl font-mono text-xs"></textarea>' +
              '  <div class="flex justify-between">' +
              '    <button type="button" id="rm-reset-default" class="px-3 py-2 bg-gray-100 text-gray-700 rounded-xl font-bold cursor-pointer">Reset ke Standar Default</button>' +
              '    <button type="button" id="rm-apply-import" class="px-4 py-2 bg-brand-600 text-white rounded-xl font-bold cursor-pointer">Terapkan Rubrik Impor</button>' +
              '  </div>' +
              '</div>';
          } else {
            bodyHtml =
              '<div class="space-y-3 max-h-96 overflow-y-auto">' +
              '  <div><label class="text-xs font-bold text-gray-600">Judul Instrumen</label><input id="rm-title-input" value="' + esc(state.instrumentTitle) + '" class="mt-1 w-full px-3 py-2 border border-gray-200 rounded-xl text-sm font-bold" /></div>' +
              draftSections.map(function (sec, sIdx) {
                return (
                  '<div class="p-3 bg-gray-50 border border-gray-200 rounded-xl space-y-2">' +
                  '  <div class="flex gap-2 items-center"><input data-sec-title="' + sIdx + '" value="' + esc(sec.title) + '" class="flex-1 px-2.5 py-1.5 bg-white border border-gray-200 rounded-lg text-xs font-bold" />' +
                  '  <button type="button" data-add-item="' + sIdx + '" class="px-2.5 py-1.5 bg-brand-600 text-white rounded-lg text-[11px] font-bold cursor-pointer">+ Indikator</button></div>' +
                  sec.items.map(function (it, iIdx) {
                    return (
                      '<div class="flex gap-2 items-start bg-white p-2 rounded-lg border border-gray-100">' +
                      '  <div class="flex-1 space-y-1"><input data-it-label="' + sIdx + ':' + iIdx + '" value="' + esc(it.label) + '" class="w-full px-2 py-1 border border-gray-200 rounded text-xs font-bold" />' +
                      '  <input data-it-desc="' + sIdx + ':' + iIdx + '" value="' + esc(it.desc) + '" class="w-full px-2 py-1 border border-gray-200 rounded text-[11px] text-gray-600" /></div>' +
                      '  <button type="button" data-del-item="' + sIdx + ':' + iIdx + '" class="text-rose-600 text-xs font-bold px-2 py-1 cursor-pointer">✕</button>' +
                      '</div>'
                    );
                  }).join('') +
                  '</div>'
                );
              }).join('') +
              '  <div class="flex justify-between pt-2">' +
              '    <button type="button" id="rm-add-sec" class="px-3 py-2 bg-gray-100 text-gray-700 rounded-xl text-xs font-bold cursor-pointer">+ Tambah Bagian</button>' +
              '    <button type="button" id="rm-save-editor" class="px-4 py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold cursor-pointer">Simpan Perubahan Rubrik</button>' +
              '  </div>' +
              '</div>';
          }

          openModal(
            '<div class="bg-white rounded-2xl p-6 max-w-2xl w-full shadow-2xl space-y-4">' +
            '  <div class="flex justify-between items-center border-b border-gray-100 pb-3"><h3 class="font-display font-bold text-lg">Kustomisasi Rubrik Supervisi</h3><button type="button" id="rm-close" class="text-xs font-bold text-gray-500 cursor-pointer">Tutup</button></div>' +
            '  <div class="flex gap-2 border-b border-gray-100 pb-2">' +
            '    <button type="button" data-rm-tab="presets" class="px-3 py-1.5 rounded-lg text-xs font-bold cursor-pointer ' + (tab === 'presets' ? 'bg-brand-600 text-white' : 'bg-gray-100 text-gray-600') + '">Preset Resmi</button>' +
            '    <button type="button" data-rm-tab="editor" class="px-3 py-1.5 rounded-lg text-xs font-bold cursor-pointer ' + (tab === 'editor' ? 'bg-brand-600 text-white' : 'bg-gray-100 text-gray-600') + '">Editor Visual</button>' +
            '    <button type="button" data-rm-tab="import" class="px-3 py-1.5 rounded-lg text-xs font-bold cursor-pointer ' + (tab === 'import' ? 'bg-brand-600 text-white' : 'bg-gray-100 text-gray-600') + '">Impor CSV / JSON</button>' +
            '  </div>' +
            bodyHtml +
            '</div>'
          );

          document.getElementById('rm-close').addEventListener('click', closeModal);
          document.querySelectorAll('[data-rm-tab]').forEach(function (el) {
            el.addEventListener('click', function () {
              tab = el.getAttribute('data-rm-tab');
              drawRubricModal();
            });
          });
          document.querySelectorAll('[data-apply-preset]').forEach(function (el) {
            el.addEventListener('click', function () {
              var preset = PRESET_INSTRUMENTS.find(function (p) { return p.id === el.getAttribute('data-apply-preset'); });
              if (preset) {
                state.rubricSections = JSON.parse(JSON.stringify(preset.sections));
                state.instrumentTitle = preset.name;
                pushToServer('saveRubricConfig', state.rubricSections, state.instrumentTitle);
                closeModal();
                showToast('Rubrik aktif diubah ke: ' + preset.name, 'success');
                render();
              }
            });
          });
          var btnReset = document.getElementById('rm-reset-default');
          if (btnReset) {
            btnReset.addEventListener('click', function () {
              state.rubricSections = JSON.parse(JSON.stringify(DEFAULT_RUBRIC_SECTIONS));
              state.instrumentTitle = 'Standar Nasional & Deep Learning';
              pushToServer('resetRubricConfig');
              closeModal();
              showToast('Rubrik dikembalikan ke Standar Default.', 'success');
              render();
            });
          }
          var btnApplyImp = document.getElementById('rm-apply-import');
          if (btnApplyImp) {
            btnApplyImp.addEventListener('click', function () {
              var raw = document.getElementById('rm-import-text').value.trim();
              if (!raw) return showToast('Masukkan teks CSV atau JSON terlebih dahulu.', 'error');
              try {
                if (raw[0] === '{' || raw[0] === '[') {
                  var parsed = JSON.parse(raw);
                  var secs = Array.isArray(parsed) ? parsed : parsed.sections;
                  if (Array.isArray(secs) && secs.length) {
                    state.rubricSections = secs;
                    if (parsed.instrumentName) state.instrumentTitle = parsed.instrumentName;
                  }
                } else {
                  var lines = raw.split(/\r?\n/).filter(function (l) { return l.trim(); });
                  var mapSec = {};
                  lines.forEach(function (line, idx) {
                    if (idx === 0 && line.toLowerCase().indexOf('kategori') >= 0) return;
                    var cols = line.split(',');
                    var cat = (cols[0] || 'UMUM').trim();
                    var lbl = (cols[1] || '').trim();
                    var dsc = cols.slice(2).join(',').trim();
                    if (!lbl) return;
                    if (!mapSec[cat]) mapSec[cat] = { id: 'sec-' + Object.keys(mapSec).length, title: cat, items: [] };
                    mapSec[cat].items.push({ id: 'imp-' + idx, label: lbl, desc: dsc || lbl });
                  });
                  var list = Object.values(mapSec);
                  if (list.length === 0) throw new Error('Format CSV tidak valid.');
                  state.rubricSections = list;
                  state.instrumentTitle = 'Instrumen Impor Kustom';
                }
                pushToServer('saveRubricConfig', state.rubricSections, state.instrumentTitle);
                closeModal();
                showToast('Rubrik kustom berhasil diterapkan.', 'success');
                render();
              } catch (err) {
                showToast('Gagal memproses rubrik: ' + err.message, 'error');
              }
            });
          }
          document.querySelectorAll('[data-sec-title]').forEach(function (el) {
            el.addEventListener('input', function () { draftSections[Number(el.getAttribute('data-sec-title'))].title = el.value; });
          });
          document.querySelectorAll('[data-it-label]').forEach(function (el) {
            el.addEventListener('input', function () {
              var p = el.getAttribute('data-it-label').split(':');
              draftSections[Number(p[0])].items[Number(p[1])].label = el.value;
            });
          });
          document.querySelectorAll('[data-it-desc]').forEach(function (el) {
            el.addEventListener('input', function () {
              var p = el.getAttribute('data-it-desc').split(':');
              draftSections[Number(p[0])].items[Number(p[1])].desc = el.value;
            });
          });
          document.querySelectorAll('[data-add-item]').forEach(function (el) {
            el.addEventListener('click', function () {
              var sIdx = Number(el.getAttribute('data-add-item'));
              draftSections[sIdx].items.push({ id: 'item-' + uuid().slice(0, 5), label: 'Indikator Baru', desc: 'Deskripsi pengamatan pembelajaran' });
              drawRubricModal();
            });
          });
          document.querySelectorAll('[data-del-item]').forEach(function (el) {
            el.addEventListener('click', function () {
              var p = el.getAttribute('data-del-item').split(':');
              draftSections[Number(p[0])].items.splice(Number(p[1]), 1);
              drawRubricModal();
            });
          });
          var btnAddSec = document.getElementById('rm-add-sec');
          if (btnAddSec) {
            btnAddSec.addEventListener('click', function () {
              draftSections.push({ id: 'sec-' + uuid().slice(0, 5), title: 'BAGIAN BARU', items: [{ id: 'item-' + uuid().slice(0, 5), label: 'Indikator 1', desc: 'Deskripsi indikator' }] });
              drawRubricModal();
            });
          }
          var btnSaveEd = document.getElementById('rm-save-editor');
          if (btnSaveEd) {
            btnSaveEd.addEventListener('click', function () {
              var titleEl = document.getElementById('rm-title-input');
              state.rubricSections = draftSections;
              if (titleEl && titleEl.value.trim()) state.instrumentTitle = titleEl.value.trim();
              pushToServer('saveRubricConfig', state.rubricSections, state.instrumentTitle);
              closeModal();
              showToast('Rubrik hasil edit berhasil disimpan.', 'success');
              render();
            });
          }
        }
        drawRubricModal();
      }

          '<div class="bg-white rounded-2xl p-6 max-w-2xl w-full shadow-2xl space-y-4 max-h-[85vh] overflow-y-auto">' +
          '  <div class="flex justify-between items-center border-b border-gray-100 pb-3">' +
          '    <div><h3 class="font-display font-bold text-lg text-gray-900">' + esc(cat.name) + '</h3><p class="text-xs text-gray-500">' + teachers.length + ' guru memerlukan intervensi pada aspek ini</p></div>' +
          '    <div class="flex gap-2"><button type="button" id="cat-pdf-btn" class="px-3 py-1.5 bg-rose-600 text-white rounded-lg text-xs font-bold cursor-pointer">Ekspor PDF</button><button type="button" id="cat-close-btn" class="px-3 py-1.5 bg-gray-100 rounded-lg text-xs font-bold cursor-pointer">Tutup</button></div>' +
          '  </div>' +
          '  <div class="p-3.5 bg-indigo-50 border border-indigo-200 rounded-xl text-xs text-indigo-950"><strong>Solusi Program IHT / Coaching:</strong> ' + esc(cat.solusiIHT) + '</div>' +
          (teachers.length === 0
            ? '<p class="text-sm text-gray-400 italic text-center py-8">Belum ada guru yang terpetakan pada kategori ini.</p>'
            : '<div class="space-y-2">' + teachers.map(function (t) {
                return '<div class="p-3.5 border border-gray-200 rounded-xl text-xs flex justify-between gap-3"><div><p class="font-bold text-gray-900 text-sm">' + esc(t.guruNama) + ' <span class="text-gray-400 font-normal">(' + esc(t.mapel) + ')</span></p><p class="text-gray-600 mt-0.5">' + esc(t.detail) + '</p></div><span class="px-2 py-0.5 h-fit rounded bg-brand-50 text-brand-700 font-bold shrink-0">' + esc(t.source) + '</span></div>';
              }).join('') + '</div>') +
          '</div>'
        );
        document.getElementById('cat-close-btn').addEventListener('click', closeModal);
        document.getElementById('cat-pdf-btn').addEventListener('click', function () {
          exportCategoryTeachersPdf(cat.name, teachers, cat.solusiIHT);
        });
      }

      function openFollowUpModal(existing) {
        var f = existing || { id: '', guruNama: '', mapel: '', temuan: '', intervensi: '', dampak: 'Dipantau' };
        openModal(
          '<form id="form-tl" class="bg-white rounded-2xl p-6 max-w-lg w-full shadow-2xl space-y-4">' +
          '  <h3 class="font-display font-bold text-lg">' + (existing ? 'Edit Tindak Lanjut' : 'Tambah Rencana Tindak Lanjut') + '</h3>' +
          '  <div class="space-y-3 text-xs">' +
          '    <div><label class="font-bold text-gray-600">Nama Guru *</label><input required id="tl-nama" value="' + esc(f.guruNama) + '" class="mt-1 w-full px-3 py-2 border border-gray-200 rounded-xl text-sm" /></div>' +
          '    <div><label class="font-bold text-gray-600">Mata Pelajaran</label><input id="tl-mapel" value="' + esc(f.mapel || '') + '" class="mt-1 w-full px-3 py-2 border border-gray-200 rounded-xl text-sm" /></div>' +
          '    <div><label class="font-bold text-gray-600">Temuan Pembelajaran *</label><input required id="tl-temuan" value="' + esc(f.temuan) + '" placeholder="Contoh: Diferensiasi konten belum optimal" class="mt-1 w-full px-3 py-2 border border-gray-200 rounded-xl text-sm" /></div>' +
          '    <div><label class="font-bold text-gray-600">Program Intervensi *</label><input required id="tl-intervensi" value="' + esc(f.intervensi) + '" placeholder="Contoh: Coaching & Workshop Modul Ajar" class="mt-1 w-full px-3 py-2 border border-gray-200 rounded-xl text-sm" /></div>' +
          '    <div><label class="font-bold text-gray-600">Dampak</label><select id="tl-dampak" class="mt-1 w-full px-3 py-2 border border-gray-200 rounded-xl text-sm">' +
          ['Dipantau', 'Meningkat', 'Perlu Pendampingan'].map(function (d) { return '<option value="' + d + '" ' + (f.dampak === d ? 'selected' : '') + '>' + d + '</option>'; }).join('') +
          '    </select></div>' +
          '  </div>' +
          '  <div class="flex justify-end gap-2">' +
          '    <button type="button" id="tl-cancel" class="px-4 py-2 text-xs font-bold text-gray-600 rounded-xl cursor-pointer">Batal</button>' +
          '    <button type="submit" class="px-5 py-2 text-xs font-bold bg-brand-600 text-white rounded-xl cursor-pointer">Simpan</button>' +
          '  </div>' +
          '</form>'
        );
        document.getElementById('tl-cancel').addEventListener('click', closeModal);
        document.getElementById('form-tl').addEventListener('submit', function (e) {
          e.preventDefault();
          var temuan = document.getElementById('tl-temuan').value.trim();
          var dampak = document.getElementById('tl-dampak').value;
          var item = {
            id: existing ? existing.id : 'tl-' + uuid().slice(0, 6),
            guruNama: document.getElementById('tl-nama').value.trim(),
            mapel: document.getElementById('tl-mapel').value.trim(),
            temuan: temuan,
            intervensi: document.getElementById('tl-intervensi').value.trim(),
            status: dampak === 'Meningkat' ? 'Terealisasi' : 'Dipantau',
            dampak: dampak,
            smartRekomendasi: getSmartRecommendation(temuan),
            sudahRefleksi: true,
            sudahTindakLanjut: true,
            perubahanPraktik: dampak === 'Meningkat',
            perluPendampingan: dampak !== 'Meningkat',
            tglSupervisi: (existing && existing.tglSupervisi) || new Date().toISOString().split('T')[0],
          };
          if (existing) state.followUps = state.followUps.map(function (x) { return x.id === item.id ? item : x; });
          else state.followUps.unshift(item);
          pushToServer('syncAllFollowUps', state.followUps);
          closeModal();
          showToast('Tindak lanjut berhasil disimpan.', 'success');
          render();
        });
      }

      function handleImportGuruExcel(e) {
        var file = e.target.files[0];
        if (!file || typeof XLSX === 'undefined') return;
        var reader = new FileReader();
        reader.onload = function (ev) {
          var wb = XLSX.read(new Uint8Array(ev.target.result), { type: 'array' });
          var rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
          var added = 0;
          rows.forEach(function (r) {
            var nama = String(r['Nama Guru'] || r['nama'] || '').trim();
            if (!nama) return;
            var gid = uuid();
            var nip = String(r['NIP'] || r['nip'] || '-');
            var mapel = String(r['Mata Pelajaran'] || r['mapel'] || '-');
            var kelas = String(r['Kelas'] || r['kelas'] || '');
            state.gurus.push({
              id: gid,
              nama: nama,
              nip: nip,
              pangkat: String(r['Pangkat / Gol'] || r['pangkat'] || '-'),
              mapel: mapel,
              jenjang: String(r['Jenjang'] || state.schoolConfig.schoolLevel),
              status: String(r['Status'] || 'ASN'),
              kelas: kelas,
            });
            var instr = createEmptyInstrument(gid, nama);
            instr.nipGuru = nip;
            instr.mapel = mapel;
            instr.kelas = kelas;
            state.supervisions.unshift({ id: 'sv-' + uuid().slice(0, 6), status: 'Direncakan', createdAt: new Date().toISOString(), instrument: instr });
            added++;
          });
          pushToServer('syncAllGurus', state.gurus);
          pushToServer('syncAllSupervisions', state.supervisions);
          showToast(added + ' guru berhasil diimpor dari Excel.', 'success');
          render();
        };
        reader.readAsArrayBuffer(file);
      }

      function handleImportScheduleExcel(e) {
        var file = e.target.files[0];
        if (!file || typeof XLSX === 'undefined') return;
        var reader = new FileReader();
        reader.onload = function (ev) {
          var wb = XLSX.read(new Uint8Array(ev.target.result), { type: 'array' });
          var rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
          var added = 0;
          rows.forEach(function (r) {
            var nama = String(r['Nama Guru'] || '').trim();
            if (!nama) return;
            var matched = state.gurus.find(function (g) { return g.nama.toLowerCase() === nama.toLowerCase(); });
            if (!matched) {
              matched = { id: uuid(), nama: nama, nip: String(r['NIP'] || '-'), pangkat: '-', mapel: String(r['Mata Pelajaran'] || '-'), jenjang: state.schoolConfig.schoolLevel, status: 'ASN' };
              state.gurus.push(matched);
            }
            var instr = createEmptyInstrument(matched.id, matched.nama);
            instr.nipGuru = String(r['NIP'] || matched.nip);
            instr.mapel = String(r['Mata Pelajaran'] || matched.mapel);
            instr.kelas = String(r['Kelas'] || '-');
            instr.materi = String(r['Materi'] || '-');
            instr.tglPra = String(r['Tgl Pra-Obs'] || '');
            instr.tglObs = String(r['Tgl Observasi'] || '');
            instr.tglPasca = String(r['Tgl Pasca-Obs'] || '');
            state.supervisions.unshift({ id: 'sv-' + uuid().slice(0, 6), status: String(r['Status'] || 'Direncakan'), createdAt: new Date().toISOString(), instrument: instr });
            added++;
          });
          pushToServer('syncAllGurus', state.gurus);
          pushToServer('syncAllSupervisions', state.supervisions);
          showToast(added + ' jadwal supervisi berhasil diimpor.', 'success');
          render();
        };
        reader.readAsArrayBuffer(file);
      }

      function runAiAnalysisForSession(sv, stage) {
        if (!isAppsScriptEnv()) {
          showToast('Analisis AI dijalankan melalui Code.gs saat dideploy di Google Apps Script.', 'info');
          return;
        }
        var g = state.gurus.find(function (x) { return x.id === sv.instrument.guruId; });
        var guruNama = (g && g.nama) || sv.instrument.namaGuru || 'Guru';
        state.aiLoading = true;
        render();

        google.script.run
          .withSuccessHandler(function (res) {
            state.aiLoading = false;
            if (stage === 'pra') sv.instrument.praAI = res.analysis;
            else if (stage === 'observasi') sv.instrument.obsAI = res.analysis;
            else if (stage === 'pasca') sv.instrument.pascaAI = res.analysis;
            if (res.kekuatan) sv.instrument.kekuatan = res.kekuatan;
            if (res.perbaikan) sv.instrument.perbaikan = res.perbaikan;
            if (res.rekomendasi) sv.instrument.rekomendasi = res.rekomendasi;
            if (res.scoreInterpretation) sv.instrument.analysisScore = res.scoreInterpretation;
            if (res.rtlSuggestion) sv.instrument.rtl = Object.assign({}, sv.instrument.rtl, res.rtlSuggestion);
            syncCompletedSupervisionsToFollowUps();
            pushToServer('syncAllSupervisions', state.supervisions);
            showToast('Analisis AI Gemini selesai diterapkan.', 'success');
            render();
          })
          .withFailureHandler(function (err) {
            state.aiLoading = false;
            showToast('Gagal analisis AI: ' + (err.message || err), 'error');
            render();
          })
          .analyzeSupervisionWithAI({ stage: stage, guruNama: guruNama, instrument: sv.instrument });
      }

      // =====================================================================
      // INISIALISASI APLIKASI
      // =====================================================================
      function initApp() {
        if (isAppsScriptEnv()) {
          google.script.run
            .withSuccessHandler(function (data) {
              if (data) {
                if (data.schoolConfig) state.schoolConfig = Object.assign({}, state.schoolConfig, data.schoolConfig);
                if (data.programConfig) state.programConfig = Object.assign({}, state.programConfig, data.programConfig);
                if (data.uploadedProgramFile) state.uploadedProgramFile = data.uploadedProgramFile;
                if (data.rubricSections && data.rubricSections.length) state.rubricSections = data.rubricSections;
                if (data.instrumentTitle) state.instrumentTitle = data.instrumentTitle;
                if (Array.isArray(data.gurus)) state.gurus = data.gurus;
                if (Array.isArray(data.supervisions)) state.supervisions = data.supervisions;
                if (Array.isArray(data.followUps)) state.followUps = data.followUps;
                state.spreadsheetId = data.spreadsheetId || state.spreadsheetId;
                state.spreadsheetUrl = data.spreadsheetUrl || state.spreadsheetUrl;
                state.driveFolderId = data.driveFolderId || state.driveFolderId;
                state.driveFolderUrl = data.driveFolderUrl || state.driveFolderUrl;
                state.hasGeminiKey = Boolean(data.hasGeminiKey);
              }
              state.loadingInitial = false;
              render();
            })
            .withFailureHandler(function (err) {
              state.loadingInitial = false;
              showToast('Mode lokal aktif (gagal memuat Sheet: ' + (err.message || err) + ')', 'error');
              render();
            })
            .getInitialAppData();
        } else {
          try {
            var raw = localStorage.getItem('siperak_gas_backup');
            if (raw) {
              var parsed = JSON.parse(raw);
              if (parsed.schoolConfig) state.schoolConfig = Object.assign({}, state.schoolConfig, parsed.schoolConfig);
              if (parsed.programConfig) state.programConfig = Object.assign({}, state.programConfig, parsed.programConfig);
              if (parsed.rubricSections) state.rubricSections = parsed.rubricSections;
              if (parsed.instrumentTitle) state.instrumentTitle = parsed.instrumentTitle;
              if (Array.isArray(parsed.gurus)) state.gurus = parsed.gurus;
              if (Array.isArray(parsed.supervisions)) state.supervisions = parsed.supervisions;
              if (Array.isArray(parsed.followUps)) state.followUps = parsed.followUps;
            }
          } catch (e) {}
          state.loadingInitial = false;
          render();
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initApp);
      } else {
        initApp();
      }
    })();
  </script>
</body>
